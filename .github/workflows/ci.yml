name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill and distribution metadata
        run: python3 tools/validate.py --complete
      - name: Site stylesheet hashes
        run: python3 tools/check_site.py
      - name: Validator tests
        run: python3 tools/test_validate.py
      - name: Package tests
        run: python3 tools/test_package_release.py
      - name: Installer tests
        run: python3 tools/test_install.py
      - name: Coaching storage tests
        run: python3 tools/test_coaching_store.py
      - name: Coaching event and CLI tests
        run: python3 tools/test_coaching_hooks.py
      - name: Model guidance tests
        run: python3 tools/test_coaching_guidance.py
      - name: Local integration installer tests
        run: python3 tools/test_coaching_install.py
      - name: Everyday learning contracts and native packaging
        run: |
          python3 tools/test_learning_catalog.py
          python3 tools/test_learning_card.py
          python3 tools/test_learning_selection.py
          python3 tools/test_native_guide.py
          python3 tools/test_learning_evaluation.py
          python3 tools/test_history.py
      - name: Native teaching plugin packages
        run: |
          python3 tools/build_teaching_plugins.py --check
          python3 tools/test_teaching_plugins.py
          python3 tools/build_teaching_plugins.py
