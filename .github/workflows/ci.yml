name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill and distribution metadata
        run: python3 tools/validate.py --complete
      - name: Validator tests
        run: python3 tools/test_validate.py
      - name: Package tests
        run: python3 tools/test_package_release.py
      - name: Installer tests
        run: python3 tools/test_install.py
